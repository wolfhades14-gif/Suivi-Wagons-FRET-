<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi Wagons FRET</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Suivi Wagons FRET">
<meta name="theme-color" content="#2C4A63">
<meta name="description" content="Suivi des wagons FRET ONCF sur les sites de Beni Ansar, Selouane et Hassi Blal.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
  :root{
    --bg:#EEF1F3;
    --surface:#FFFFFF;
    --border:#D7DEE3;
    --text:#16232E;
    --muted:#5B6B7A;
    --primary:#2C4A63;
    --primary-light:#3E647F;
    --primary-bg:#E4ECF1;
    --amber:#B36B00;
    --amber-bg:#FBEBD2;
    --green:#2E6B4C;
    --green-bg:#DEEEE4;
    --red:#A6362B;
    --red-bg:#F7E1DF;
    --radius:14px;
    --radius-sm:8px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
    max-width:520px;
    margin:0 auto;
    width:100%;
    background:var(--bg);
  }
  header.top{
    flex:0 0 auto;
    background:var(--primary);
    color:#fff;
    padding:16px 18px 14px;
    position:sticky; top:0; z-index:5;
  }
  header.top h1{
    font-size:19px;
    margin:0 0 2px;
    font-weight:650;
    letter-spacing:-0.01em;
  }
  header.top p{
    margin:0;
    font-size:12.5px;
    color:#C7D5DE;
  }
  .chips-row{
    display:flex;
    gap:8px;
    margin-top:12px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .chip-stat{
    flex:1 0 auto;
    background:rgba(255,255,255,0.1);
    border-radius:var(--radius-sm);
    padding:7px 10px;
    min-width:78px;
  }
  .chip-stat .n{ font-size:17px; font-weight:700; display:block; line-height:1.1; }
  .chip-stat .l{ font-size:10.5px; color:#C7D5DE; display:block; margin-top:1px; }

  main{
    flex:1 1 auto;
    overflow-y:auto;
    padding:16px 16px 90px;
    -webkit-overflow-scrolling:touch;
  }
  nav.tabbar{
    flex:0 0 auto;
    display:flex;
    background:var(--surface);
    border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    position:sticky; bottom:0; z-index:5;
  }
  nav.tabbar button{
    flex:1;
    border:none;
    background:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:6px 2px;
    font-size:11px;
    color:var(--muted);
    font-family:inherit;
    border-radius:var(--radius-sm);
  }
  nav.tabbar button.active{ color:var(--primary); background:var(--primary-bg); }
  nav.tabbar button svg{ width:20px; height:20px; }

  h2.section-title{ font-size:15.5px; font-weight:650; margin:0 0 10px; }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:12px;
  }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .stat-box{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; }
  .stat-box .num{ font-size:26px; font-weight:700; }
  .stat-box .lab{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .stat-box.dispo .num{ color:var(--green); }
  .stat-box.immob .num{ color:var(--red); }
  .stat-box.repar .num{ color:var(--amber); }
  .stat-box.attente .num{ color:var(--primary); }
  .stat-box.reforme .num{ color:#6B4F8A; }
  .memory-strip{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 11px; margin-bottom:12px; font-size:12px; color:var(--muted); display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .memory-strip strong{ color:var(--text); }
  .hist-note{ font-size:11.5px; color:var(--muted); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-bottom:10px; }
  .hist-item.cancelled{ opacity:.58; }
  .hist-cancel{ font-size:11.5px; color:var(--red); background:none; border:1px solid var(--border); border-radius:6px; padding:5px 8px; margin-top:6px; font-family:inherit; }
  .stat-box.reforme .num{ color:#6B4F8A; }

  .site-bar-row{ margin-bottom:10px; }
  .site-bar-row .head{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; }
  .site-bar-row .track{ height:8px; background:var(--border); border-radius:5px; overflow:hidden; display:flex; }
  .site-bar-row .seg{ height:100%; }

  label{ display:block; font-size:12.5px; color:var(--muted); margin:14px 0 6px; font-weight:600; }
  label:first-child{ margin-top:0; }
  input, select, textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    font-size:15px;
    font-family:inherit;
    background:#fff;
    color:var(--text);
  }
  textarea{ min-height:70px; resize:vertical; }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--primary-light); outline-offset:1px; }
  .field-error{ color:var(--red); font-size:12px; margin-top:4px; display:none; }
  .field-error.show{ display:block; }

  .btn{
    display:block;
    width:100%;
    text-align:center;
    background:var(--primary);
    color:#fff;
    border:none;
    padding:13px;
    border-radius:var(--radius-sm);
    font-size:15px;
    font-weight:650;
    margin-top:18px;
    font-family:inherit;
  }
  .btn:active{ background:var(--primary-light); }
  .btn.secondary{ background:var(--surface); color:var(--primary); border:1px solid var(--primary); }
  .btn.ghost{ background:none; color:var(--red); border:1px solid var(--red); }

  .search-row{ display:flex; gap:8px; margin-bottom:10px; }
  .search-row input{ flex:1; }
  .site-filter{ display:flex; gap:6px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px; }
  .site-filter button{
    flex:0 0 auto;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    padding:7px 12px;
    border-radius:20px;
    font-size:12.5px;
    font-family:inherit;
  }
  .site-filter button.active{ background:var(--primary); color:#fff; border-color:var(--primary); }

  .wagon-card{
    display:flex;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
  }
  .wagon-card .bar{ width:5px; flex:0 0 auto; }
  .wagon-card .body{ padding:11px 13px; flex:1; min-width:0; }
  .wagon-card .row1{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .wagon-card .num{ font-size:16px; font-weight:700; letter-spacing:0.01em; }
  .badge{ font-size:11.5px; font-weight:650; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .meta-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .meta-tag{ font-size:11.5px; color:var(--muted); background:var(--bg); padding:2px 8px; border-radius:6px; }
  .card-obs{ font-size:13px; color:var(--text); margin-top:7px; line-height:1.35; }
  .card-foot{ font-size:11px; color:var(--muted); margin-top:7px; }

  .empty{ text-align:center; padding:40px 16px; color:var(--muted); }
  .empty .big{ font-size:34px; margin-bottom:8px; }
  .empty p{ font-size:13.5px; line-height:1.5; margin:4px 0 0; }

  .toast{
    position:fixed; left:50%; bottom:90px; transform:translateX(-50%);
    background:var(--text); color:#fff; padding:10px 18px; border-radius:24px;
    font-size:13.5px; z-index:50; opacity:0; transition:opacity .2s;
    pointer-events:none; white-space:nowrap;
  }
  .toast.show{ opacity:1; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,15,20,0.5);
    display:flex; align-items:flex-end; z-index:40;
  }
  .modal-overlay.hidden{ display:none; }
  .modal-sheet{
    background:var(--bg); width:100%; max-height:82vh; overflow-y:auto;
    border-radius:18px 18px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom));
    max-width:520px; margin:0 auto;
  }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .modal-head h3{ margin:0; font-size:16.5px; }
  .modal-close{ border:none; background:none; font-size:22px; color:var(--muted); line-height:1; padding:4px; }
  .hist-item{ border-left:3px solid var(--border); padding:2px 0 12px 12px; margin-bottom:2px; position:relative; }
  .hist-item:last-child{ border-color:transparent; }
  .hist-item .dot{ position:absolute; left:-6px; top:4px; width:9px; height:9px; border-radius:50%; }
  .hist-item .when{ font-size:11.5px; color:var(--muted); }
  .hist-item .st{ font-size:13.5px; font-weight:650; margin:2px 0; }
  .hist-item .det{ font-size:12.5px; color:var(--text); }
  .hist-del{ font-size:11.5px; color:var(--red); background:none; border:none; padding:4px 0; font-family:inherit; }

  .banner{ background:var(--red-bg); color:var(--red); border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .banner button{ border:none; background:var(--red); color:#fff; border-radius:6px; padding:5px 10px; font-size:12px; font-family:inherit; }
  .loading-row{ text-align:center; padding:30px 0; color:var(--muted); font-size:13.5px; }

  .storage-status{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:12px;background:#F7FAFB;}
  .storage-status .dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex:0 0 auto;}
  .storage-status.bad .dot{background:var(--red);}
  .storage-status strong{font-size:13px;}
  .small{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .backup-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px;}
  .backup-stats>div{background:var(--primary-bg);border-radius:10px;padding:10px;text-align:center;}
  .backup-stats b{display:block;font-size:20px;}
  .backup-stats span{font-size:11.5px;color:var(--muted);}
  .help-text{font-size:11.5px;color:var(--muted);line-height:1.45;margin:10px 0 0;}
  .security-list{margin:0;padding-left:19px;color:var(--muted);font-size:12px;line-height:1.6;}
  .security-list li{margin-bottom:5px;}

  .v6-filter-card{padding-bottom:10px;}
  .filter-title{font-weight:700;font-size:15px;margin-bottom:8px;}
  .filter-label{font-size:11.5px;color:var(--muted);margin:7px 0 5px;}
  .v6-filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;}
  .filter-chip{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:7px 11px;border-radius:20px;font-size:11.5px;font-family:inherit;}
  .filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .v6-stats .stat-box{min-width:0;}
  .kpi-grid,.aging-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .kpi-grid>div,.aging-grid>div{background:var(--bg);border-radius:10px;padding:11px;text-align:center;}
  .kpi-grid b,.aging-grid b{display:block;font-size:22px;}
  .kpi-grid span,.aging-grid span{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
  .metric-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .metric-row:last-child{border-bottom:0;}
  .muted-small{font-size:10.8px;color:var(--muted);margin-top:3px;line-height:1.35;}
  .week-row{display:grid;grid-template-columns:58px 1fr 28px 45px;gap:6px;align-items:center;margin:8px 0;font-size:10.5px;}
  .week-label{color:var(--muted);}
  .week-track{height:9px;background:var(--bg);border-radius:8px;overflow:hidden;}
  .week-fill{height:100%;background:var(--primary);border-radius:8px;min-width:3px;}
  .week-num{font-weight:700;text-align:right;}
  .week-imm{color:var(--red);text-align:right;}
  .legend-small{font-size:10.5px;color:var(--muted);margin-top:8px;}
  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .quick-grid>div{background:var(--bg);padding:11px;border-radius:10px;display:flex;flex-direction:column;gap:5px;}
  .quick-grid span{font-size:11px;color:var(--muted);}
  .quick-grid b{font-size:20px;}
  .attention-table{display:flex;flex-direction:column;gap:8px;}
  .attention-row{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--surface);cursor:pointer;}
  .attention-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .attention-wagon{font-weight:750;font-size:14px;}
  .age-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:15px;background:var(--bg);color:var(--muted);white-space:nowrap;}
  .age-badge.a7{color:#8a6500;background:#fff5cf;}
  .age-badge.a15{color:#a94f00;background:#fff0e2;}
  .age-badge.a30{color:var(--red);background:var(--red-bg);}
  .attention-meta{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.4;}
  .attention-empty{font-size:12px;color:var(--muted);padding:8px 0;}
  .age-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px;}
  .age-summary>div{background:var(--bg);border-radius:9px;padding:9px 5px;text-align:center;}
  .age-summary b{display:block;font-size:19px;}
  .age-summary span{font-size:10.5px;color:var(--muted);}
  .v9-overview{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .v9-panel{background:var(--bg);border-radius:10px;padding:11px;}
  .v9-panel .v9-title{font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:650;}
  .v9-panel b{display:block;font-size:24px;}
  .v9-panel small{display:block;font-size:10.8px;color:var(--muted);margin-top:3px;line-height:1.35;}
  .treatment-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .treatment-grid>div{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--surface);}
  .treatment-grid b{display:block;font-size:22px;}
  .treatment-grid span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;}
  .v9-note{font-size:11.5px;color:var(--muted);line-height:1.45;margin:9px 0 0;}
  @media (max-width:380px){.week-row{grid-template-columns:52px 1fr 24px 40px}.stat-box{padding:11px}.stat-box .num{font-size:23px;}}

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Suivi Wagons FRET</h1>
    <p>Beni Ansar, Selouane et Hassi Blal</p>
    <div class="chips-row" id="headerChips"></div>
  </header>

  <main id="main"></main>

  <nav class="tabbar" id="tabbar">
    <button data-view="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Tableau
    </button>
    <button data-view="saisie">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Saisie
    </button>
    <button data-view="situation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      Situation
    </button>
    <button data-view="export">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
      Export
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<script>
/* ---------- Reference data ---------- */
const SITES = ["Beni Ansar (Gare)","Beni Ansar (Port)","Selouane","Hassi Blal"];
const SERIES = ["Tads","Fads","Uads","Fads SCIF","Fads Barytine","Autre"];
// Auto-fill mapping from the first 4 digits of a wagon number to its série,
// per the ONCF Parc du Matériel (Annexe 1, Contrat PFL-PMM N° 12/2021).
const SERIE_BY_PREFIX = {
  "5838": "Tads", "5839": "Tads",             // Tads charbon/barytine
  "6970": "Fads", "6971": "Fads",             // Fads charbon
  "6960": "Fads Barytine",                    // Fadsf barytine
  "9310": "Fads SCIF",                        // Fads charbon SCIF (93105)
  "9313": "Uads", "9314": "Uads", "9315": "Uads",   // Uads charbon/calcaire
  "9325": "Uads", "9326": "Uads", "9328": "Uads", "9329": "Uads" // Uads charbon
};
function serieFromWagon(wagon){
  if(!wagon || wagon.length < 4) return null;
  return SERIE_BY_PREFIX[wagon.slice(0, 4)] || null;
}
const STATUSES = ["Disponible","Immobilisé","En réparation","En attente","Réformé"];
const STATUS_COLOR = {
  "Disponible":   { c: "var(--green)",  bg:"var(--green-bg)" },
  "Immobilisé":   { c: "var(--red)",    bg:"var(--red-bg)" },
  "En réparation":{ c: "var(--amber)",  bg:"var(--amber-bg)" },
  "En attente":   { c: "var(--primary)",bg:"var(--primary-bg)" },
  "Réformé":      { c: "#6B4F8A",      bg:"#EEE7F5" }
};
const MOTIFS = ["Aucune","VG","RA","RLCB","RLB","ILD","PDR","Frein","Caisse","Trappe","Autre"];
const ISOLATION_CODES = ["Aucun","1301","1302","1303"];

/* ---------- State ---------- */
let entries = [];
let storageOk = true;
let lastSavedAt = null;
let state = { view: "dashboard", filterSite: "Tous", search: "", historyWagon: null, dashboardSite: "Tous", dashboardStatus: "Tous" };

// V4: append-only local history. Every submission gets its own record and is never overwritten.
// The old key is retained so existing pilot data remains available after the upgrade.
const STORAGE_KEY = "wagons-charbon-entries";
const BACKUP_KEY = "wagons-fret-history-backup";
const META_KEY = "wagons-fret-storage-meta";
const STORAGE_VERSION = 9;
const PREVIOUS_BACKUP_KEY = "wagons-fret-history-backup-previous";

/* ---------- Storage helpers ---------- */
function normalizeEntries(list){
  return (Array.isArray(list) ? list : []).map((e, i) => ({
    ...e,
    id: e.id || ("legacy-" + i + "-" + Date.now().toString(36)),
    seq: Number.isFinite(e.seq) ? e.seq : i + 1,
    cancelled_at: e.cancelled_at || null,
    cancelled_reason: e.cancelled_reason || ""
  }));
}
async function loadEntries(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    const backup = localStorage.getItem(BACKUP_KEY);
    const previousBackup = localStorage.getItem(PREVIOUS_BACKUP_KEY);
    let parsed = null;
    if(raw){
      try { parsed = JSON.parse(raw); } catch(e) { parsed = null; }
    }
    if(!parsed && backup){
      try { parsed = JSON.parse(backup); } catch(e) { parsed = null; }
    }
    if(!parsed && previousBackup){
      try { parsed = JSON.parse(previousBackup); } catch(e) { parsed = null; }
    }
    entries = normalizeEntries(parsed || []);
    const metaRaw = localStorage.getItem(META_KEY);
    const meta = metaRaw ? JSON.parse(metaRaw) : {};
    lastSavedAt = meta.lastSavedAt || null;
    storageOk = true;
    // Repair/upgrade old records once, without changing their content.
    if(entries.some((e,i) => !e.id || !Number.isFinite(e.seq))) await saveEntries();
  }catch(e){
    storageOk = false;
    entries = [];
  }
}
async function saveEntries(){
  try{
    const payload = JSON.stringify(entries);
    // V5: keep a previous snapshot before replacing the main record.
    const current = localStorage.getItem(STORAGE_KEY);
    if(current) localStorage.setItem(PREVIOUS_BACKUP_KEY, current);
    // Main backup + main data. If the main write fails, the previous snapshot remains available.
    localStorage.setItem(BACKUP_KEY, payload);
    localStorage.setItem(STORAGE_KEY, payload);
    lastSavedAt = new Date().toISOString();
    localStorage.setItem(META_KEY, JSON.stringify({
      version:STORAGE_VERSION,
      lastSavedAt,
      totalEntries:entries.length,
      lastSeq:entries.reduce((m,e)=>Math.max(m,Number(e.seq)||0),0)
    }));
    storageOk = true;
    return true;
  }catch(e){
    storageOk = false;
    return false;
  }
}
function activeEntries(){ return entries.filter(e => !e.cancelled_at); }

/* ---------- Utilities ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function isoWeekDefault(){
  const now = new Date();
  const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  const weekNum = 1 + Math.round(((d - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
  return `${d.getUTCFullYear()}-W${String(weekNum).padStart(2,"0")}`;
}
function fmtDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("fr-FR", { day:"2-digit", month:"2-digit", year:"numeric" }) + " " +
         d.toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---------- Derived data ---------- */
function latestPerWagon(list){
  const map = new Map();
  for(const e of list){
    if(e.cancelled_at) continue;
    map.set(e.wagon, e); // last active occurrence wins; older records remain in history
  }
  return Array.from(map.values());
}
// V8: a wagon marked Réformé remains counted as reformé until a later
// Disponible entry is recorded. Changing to Immobilisé / En réparation /
// En attente does not cancel the reform status.
function reformStateForWagon(wagon){
  const rows = historyForWagon(wagon);
  let reformed = false;
  let since = null;
  for(const e of rows){
    if(e.status === "Réformé"){ reformed = true; since = e; }
    else if(e.status === "Disponible"){ reformed = false; since = null; }
  }
  return { reformed, since };
}
function isReformPending(entry){
  return reformStateForWagon(entry.wagon).reformed;
}
function reformPendingRows(list = latestPerWagon(entries)){
  return list.filter(e => isReformPending(e));
}
function filteredSituation(){
  let latest = latestPerWagon(entries);
  if(state.filterSite !== "Tous") latest = latest.filter(e => e.site === state.filterSite);
  if(state.search) latest = latest.filter(e => e.wagon.includes(state.search.trim()));
  latest.sort((a,b) => a.site.localeCompare(b.site) || a.wagon.localeCompare(b.wagon));
  return latest;
}

}

function renderTabbar(){

  });

function isoWeekFromDate(date){
  const d = new Date(date);
  if(Number.isNaN(d.getTime())) return "";
  const utc = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = (utc.getUTCDay() + 6) % 7;
  utc.setUTCDate(utc.getUTCDate() - day + 3);
  const firstThursday = new Date(Date.UTC(utc.getUTCFullYear(),0,4));
  const week = 1 + Math.round(((utc - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay()+6)%7)) / 7);
  return `${utc.getUTCFullYear()}-W${String(week).padStart(2,"0")}`;
}
function daysSince(iso){
  const t = new Date(iso).getTime();
  if(!Number.isFinite(t)) return null;
  return Math.max(0, Math.floor((Date.now()-t)/86400000));
}
function problemStatus(status){
  return ["Immobilisé","En réparation","En attente"].includes(status);
}
function historyForWagon(wagon){
  return entries.filter(e => e.wagon === wagon && !e.cancelled_at)
    .sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
}
function currentEpisodeStart(entry){
  if(!problemStatus(entry.status)) return null;
  const rows = historyForWagon(entry.wagon);
  let idx = rows.findIndex(e => e.id === entry.id);
  if(idx < 0) idx = rows.length - 1;
  while(idx > 0 && problemStatus(rows[idx-1].status)) idx--;
  return rows[idx] || entry;
}
function episodeAgeDays(entry){
  const start = currentEpisodeStart(entry);
  return start ? (daysSince(start.created_at) ?? 0) : null;
}
function ageClass(days){
  if(days >= 30) return "a30";
  if(days >= 15) return "a15";
  if(days >= 7) return "a7";
  return "";
}
function ageLabel(days){
  if(days >= 30) return "≥ 30 j";
  if(days >= 15) return "≥ 15 j";
  if(days >= 7) return "≥ 7 j";
  return `${days} j`;
}
function statusTransitionEntries(status, week){
  const rows = [...activeEntries()].sort((a,b) => new Date(a.created_at)-new Date(b.created_at));
  return rows.filter(e => {
    if(e.status !== status || (week && e.week !== week)) return false;
    const hist = historyForWagon(e.wagon);
    const idx = hist.findIndex(x => x.id === e.id);
    const prev = idx > 0 ? hist[idx-1] : null;
    return !prev || prev.status !== status;
  });
}
function dashboardLatest(){
  let rows = latestPerWagon(entries);
  if(state.dashboardSite !== "Tous") rows = rows.filter(e => e.site === state.dashboardSite);
  if(state.dashboardStatus !== "Tous") {
    if(state.dashboardStatus === "Réformé") rows = rows.filter(e => isReformPending(e));
    else rows = rows.filter(e => e.status === state.dashboardStatus);
  }
  return rows;
}
function viewDashboard(){
  if(!storageOk){

  if(allLatest.length === 0){

  // Réformé is a persistent operational flag until the wagon is declared Disponible.
  counts["Réformé"] = reformPendingRows(latest).length;
  const activeCount = activeEntries().length;

  const weekEntries = activeEntries().filter(e => e.week === currentWeek);
  const newImmobilisations = statusTransitionEntries("Immobilisé", currentWeek).length;

  const statusOptions = ["Tous", ...STATUSES].map(s => `<button class="filter-chip ${state.dashboardStatus===s?'active':''}" data-dash-status="${esc(s)}">${esc(s)}</button>`).join("");

  const bySite = SITES.map(site => {
    const rows = allLatest.filter(e => e.site === site);
    const imm = rows.filter(e => e.status === "Immobilisé").length;
    const rep = rows.filter(e => e.status === "En réparation").length;
    const reform = rows.filter(e => isReformPending(e)).length;
    return `<div class="metric-row"><div><b>${esc(site)}</b><div class="muted-small">${rows.length} wagon${rows.length>1?'s':''} · ${imm} immobilisé${imm>1?'s':''} · ${rep} en réparation · ${reform} réformé${reform>1?'s':''}</div></div><strong>${rows.length}</strong></div>`;
  }).join("");

  const currentProblem = latest.filter(e => ["Immobilisé","En réparation","En attente"].includes(e.status));
  const reformPending = reformPendingRows(latest);
  const motifMap = new Map();
  currentProblem.forEach(e => { const m=e.motif || "Aucune"; motifMap.set(m,(motifMap.get(m)||0)+1); });
  const topMotifs = [...motifMap.entries()].sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0])).slice(0,5);
  const motifHtml = topMotifs.length ? topMotifs.map(([m,n])=>`<div class="metric-row"><span>${esc(m)}</span><strong>${n}</strong></div>`).join("") : `<div class="muted-small">Aucune anomalie/motif sur les situations en cours.</div>`;

  const weeks=[];
  const now=new Date();
  for(let i=5;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i*7); const w=isoWeekFromDate(d); weeks.push(w); }
  const weekly = weeks.map(w=>({w, total:activeEntries().filter(e=>e.week===w).length, imm:activeEntries().filter(e=>e.week===w && e.status==="Immobilisé").length}));
  const maxWeek=Math.max(1,...weekly.map(x=>x.total));
  const weeklyHtml=weekly.map(x=>`<div class="week-row"><div class="week-label">${esc(x.w)}</div><div class="week-track"><div class="week-fill" style="width:${Math.max(4,x.total/maxWeek*100)}%"></div></div><div class="week-num">${x.total}</div><div class="week-imm">${x.imm} imm.</div></div>`).join("");

  return `
    <div class="card v6-filter-card">
      <div class="filter-title">Filtres du pilotage</div>
      <div class="filter-label">Site</div><div class="v6-filters">${siteOptions}</div>
      <div class="filter-label">Situation</div><div class="v6-filters">${statusOptions}</div>
      <div class="muted-small">Affichage : ${latest.length} wagon${latest.length>1?'s':''} · ${activeCount} saisie${activeCount>1?'s':''} active${activeCount>1?'s':''} au total</div>
    </div>
    ${statBoxes}
    <div class="card">
      <h2 class="section-title">V9 · Parc non disponible</h2>
      <div class="v9-overview">
        <div class="v9-panel">
          <div class="v9-title">Parc non disponible</div>
          <b>${latest.filter(e=>e.status!=="Disponible").length}</b>
          <small>Tout wagon dont la situation actuelle n'est pas « Disponible ».</small>
        </div>
        <div class="v9-panel">
          <div class="v9-title">Réformés / non disponibles</div>
          <b>${reformPendingRows(latest).length}</b>
          <small>Réforme maintenue jusqu'à une saisie « Disponible ».</small>
        </div>
      </div>
      <p class="v9-note">La réforme est un état métier persistant. Un wagon peut donc être « En réparation » tout en restant compté dans les « Réformés / non disponibles ».</p>
    </div>
    <div class="card">
      <h2 class="section-title">V9 · État du traitement</h2>
      <div class="treatment-grid">

        <div><b>${latest.filter(e=>e.status==="En réparation").length}</b><span>En cours</span></div>
        <div><b>${latest.filter(e=>e.status==="En attente").length}</b><span>En attente d'action</span></div>
        <div><b>${latest.filter(e=>e.status==="Disponible").length}</b><span>Traité / disponible</span></div>
      </div>
      <p class="v9-note">Cette lecture décrit l'étape de traitement actuelle. Elle est indépendante du marqueur « Réformé / non disponible ».</p>
    </div>
    <div class="card">
      <h2 class="section-title">Indicateurs de la semaine · ${esc(currentWeek)}</h2>
      <div class="kpi-grid">
        <div><b>${weekEntries.length}</b><span>Saisies</span></div>
        <div><b>${newImmobilisations}</b><span>Nouveaux immobilisés</span></div>
        <div><b>${released}</b><span>Disponibles enregistrés</span></div>
        <div><b>${reformes}</b><span>Réformes enregistrées</span></div>
      </div>
    </div>
    <div class="card">
      <h2 class="section-title">Statut de réforme</h2>

        <div><span>Wagons encore comptés réformés</span><b>${reformPending.length}</b></div>

      </div>
      <p class="help-text">Un wagon marqué « Réformé » reste compté comme réformé tant qu'une saisie ultérieure ne le déclare pas « Disponible », même s'il passe entre-temps par « Immobilisé », « En réparation » ou « En attente ».</p>
    </div>
    <div class="card">
      <h2 class="section-title">Ancienneté des situations en cours</h2>
      <div class="aging-grid">
        <div><b>${aged[0]}</b><span>≥ 7 jours</span></div>
        <div><b>${aged[1]}</b><span>≥ 15 jours</span></div>
        <div><b>${aged[2]}</b><span>≥ 30 jours</span></div>
      </div>
      <p class="help-text">Calcul basé sur le début de l’épisode continu. Ce sont des seuils de pilotage, pas des seuils réglementaires.</p>
    </div>
    <div class="card">
      <h2 class="section-title">Wagons en cours · ancienneté réelle</h2>
      <div class="muted-small">L'ancienneté correspond au début de l'épisode continu d'immobilisation (Immobilisé / En réparation / En attente), et non à la dernière saisie.</div>
      <div class="age-summary">
        <div><b>${aged[0]}</b><span>≥ 7 jours</span></div>
        <div><b>${aged[1]}</b><span>≥ 15 jours</span></div>
        <div><b>${aged[2]}</b><span>≥ 30 jours</span></div>
      </div>
      <div class="attention-table" style="margin-top:10px;">
        ${ages.length ? ages.sort((a,b)=>b.days-a.days || a.entry.wagon.localeCompare(b.entry.wagon)).slice(0,20).map(x => {
          const e=x.entry, cls=ageClass(x.days), start=x.start;
          return `<div class="attention-row" data-age-wagon="${esc(e.wagon)}"><div class="attention-top"><span class="attention-wagon">${esc(e.wagon)}</span><span class="age-badge ${cls}">${ageLabel(x.days)}</span></div><div class="attention-meta">${esc(e.status)} · ${esc(e.site)} · début épisode : ${start ? fmtDateTime(start.created_at) : "À confirmer"}${e.motif && e.motif!=="Aucune" ? " · " + esc(e.motif) : ""}</div></div>`;
        }).join("") : `<div class="attention-empty">Aucun wagon actuellement en situation d'immobilisation / réparation / attente.</div>`}
      </div>
    </div>
    <div class="card">
      <h2 class="section-title">V9 · Priorités d'action</h2>
      <p class="help-text">Lecture d'aide à la décision : priorité basée sur l'ancienneté réelle de l'épisode et sur le maintien du statut de réforme. Aucun seuil réglementaire n'est supposé.</p>
      <div class="attention-table">
        ${(()=>{
          const items = [];
          for(const x of ages){
            let priority = x.days >= 30 ? "URGENT" : x.days >= 15 ? "À TRAITER" : x.days >= 7 ? "À SURVEILLER" : "EN COURS";
            let action = x.entry.status === "En réparation" ? "Suivre la fin des travaux puis la remise à disposition" : x.entry.status === "Immobilisé" ? "Identifier l'action nécessaire pour débloquer l'immobilisation" : "Identifier le blocage et engager l'action";
            if(isReformPending(x.entry)) action += " · wagon encore compté réformé";
            items.push({wagon:x.entry.wagon, priority, action, days:x.days, site:x.entry.site, status:x.entry.status});
          }
          for(const e of reformPending){
            if(!problemStatus(e.status) && e.status !== "Réformé") continue;
            if(items.some(x=>x.wagon===e.wagon)) continue;
            items.push({wagon:e.wagon, priority:"RÉFORMÉ", action:"Suivre la situation jusqu'à la déclaration Disponible", days:null, site:e.site, status:e.status});
          }
          const rank={"URGENT":0,"À TRAITER":1,"À SURVEILLER":2,"RÉFORMÉ":3,"EN COURS":4};
          items.sort((a,b)=>(rank[a.priority]-rank[b.priority]) || ((b.days??-1)-(a.days??-1)));
          return items.slice(0,20).map(x=>`<div class="attention-row"><div class="attention-top"><span class="attention-wagon">${esc(x.wagon)}</span><span class="age-badge ${x.priority==='URGENT'?'a30':x.priority==='À TRAITER'?'a15':x.priority==='À SURVEILLER'?'a7':''}">${esc(x.priority)}</span></div><div class="attention-meta">${esc(x.status)} · ${esc(x.site)}${x.days!==null ? ` · ${x.days} j` : ""}</div><div class="muted-small" style="margin-top:4px;">${esc(x.action)}</div></div>`).join("") || `<div class="attention-empty">Aucune priorité particulière identifiée avec les données disponibles.</div>`;
        })()}
      </div>
    </div>
    <div class="card">
      <h2 class="section-title">Répartition par site</h2>
      ${bySite}
    </div>
    <div class="card">
      <h2 class="section-title">Top motifs des situations en cours</h2>
      ${motifHtml}
    </div>
    <div class="card">
      <h2 class="section-title">Activité des 6 dernières semaines</h2>
      ${weeklyHtml}
      <div class="legend-small">Nombre de saisies · « imm. » = saisies avec situation Immobilisé</div>
    </div>
    <div class="card">
      <h2 class="section-title">Lecture rapide</h2>
      <div class="quick-grid">
        <div><span>Taux de wagons actuellement disponibles</span><b>${rate}%</b></div>
        <div><span>Wagons sous étiquette mod.</span><b>${isoled}</b></div>
      </div>
    </div>
  `;
}

          <span class="meta-tag">Sem. ${esc(e.week)}</span>

          ${e.isolation && e.isolation !== "Aucun" ? `<span class="meta-tag">Étiquette mod: ${esc(e.isolation)}</span>` : ""}
          ${isReformPending(e) ? `<span class="meta-tag">Réforme en cours</span>` : ""}
        </div>
        ${e.observation ? `<div class="card-obs">${esc(e.observation)}</div>` : ""}
        <div class="card-foot">${esc(e.visitor || "Agent non renseigné")} · ${fmtDateTime(e.created_at)}</div>
      </div>
    </div>
  `;
}

      <div class="storage-status ${storageOk ? "ok" : "bad"}">
        <span class="dot"></span>
        <div>
          <strong>${storageOk ? "Mémoire locale opérationnelle" : "Problème de mémoire locale"}</strong>
          <div class="small">Dernière sauvegarde automatique : ${esc(lastSaved)}</div>
        </div>
      </div>
      <div class="backup-stats">

function bannerHTML(){
  return `<div class="banner"><span>Erreur de chargement des données.</span><button id="retryLoad">Réessayer</button></div>`;
}

/* ---------- History modal ---------- */
function openHistory(wagon){
  const rows = entries.filter(e => e.wagon === wagon).sort((a,b) => b.created_at.localeCompare(a.created_at));
  const overlay = document.getElementById("modalOverlay");
  const sheet = document.getElementById("modalSheet");
  sheet.innerHTML = `
    <div class="modal-head">
      <h3>Historique — wagon ${esc(wagon)}</h3>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="hist-note">Chaque saisie est conservée. Une correction ne supprime pas l'ancien enregistrement : elle l'annule et laisse sa trace dans l'historique.</div>
    ${rows.map(e => {
      const col = STATUS_COLOR[e.status] || STATUS_COLOR["En attente"];
      return `
        <div class="hist-item ${e.cancelled_at ? "cancelled" : ""}" style="border-color:${col.c}">
          <div class="dot" style="background:${col.c}"></div>
          <div class="when">${fmtDateTime(e.created_at)} · Semaine ${esc(e.week)}</div>
          <div class="st" style="color:${col.c}">${esc(e.status)}</div>
          <div class="det">${esc(e.site)} · ${esc(e.serie)}${e.motif && e.motif!=="Aucune" ? " · " + esc(e.motif) : ""}${e.isolation && e.isolation!=="Aucun" ? " · étiquette mod: " + esc(e.isolation) : ""}</div>
          ${e.observation ? `<div class="det">${esc(e.observation)}</div>` : ""}
          <div class="card-foot">${esc(e.visitor || "Agent non renseigné")}</div>
          ${e.cancelled_at ? `<div class="det" style="color:var(--red)">Saisie annulée le ${fmtDateTime(e.cancelled_at)}${e.cancelled_reason ? " · " + esc(e.cancelled_reason) : ""}</div>` : `<button class="hist-cancel" data-id="${esc(e.id)}">Annuler cette saisie</button>`}
        </div>`;
    }).join("")}
  `;
  overlay.classList.remove("hidden");
  document.getElementById("modalClose").onclick = closeHistory;
  sheet.querySelectorAll(".hist-cancel").forEach(btn => {
    btn.onclick = async () => {
      const reason = prompt("Motif d'annulation (facultatif) :", "Erreur de saisie");
      if(reason === null) return;
      const target = entries.find(e => e.id === btn.dataset.id);
      if(!target || target.cancelled_at) return;
      target.cancelled_at = new Date().toISOString();
      target.cancelled_reason = reason.trim();
      const ok = await saveEntries();
      if(ok){ showToast("Saisie annulée, historique conservé"); }
      else { target.cancelled_at = null; target.cancelled_reason = ""; showToast("Échec de l'enregistrement"); }
      openHistory(wagon);
      render();
    };
  });
}
function closeHistory(){
  document.getElementById("modalOverlay").classList.add("hidden");
}

/* ---------- CSV export ---------- */
function toCSV(rows, headers, mapper){
  const lines = [headers.join(",")];
  for(const r of rows){
    lines.push(mapper(r).map(v => `"${String(v ?? "").replace(/"/g,'""')}"`).join(","));
  }
  return "\uFEFF" + lines.join("\r\n");
}
function downloadCSV(content, filename){
  const blob = new Blob([content], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- Event handlers ---------- */
function attachViewHandlers(){
  if(state.view === "dashboard"){
    document.querySelectorAll("[data-dash-site]").forEach(btn => btn.addEventListener("click", () => { state.dashboardSite = btn.dataset.dashSite; render(); }));
    document.querySelectorAll("[data-dash-status]").forEach(btn => btn.addEventListener("click", () => { state.dashboardStatus = btn.dataset.dashStatus; render(); }));
    document.querySelectorAll("[data-age-wagon]").forEach(card => card.addEventListener("click", () => openHistory(card.dataset.ageWagon)));
  }
  if(state.view === "saisie"){
    const form = document.getElementById("saisieForm");
    const wagonInput = form.querySelector('input[name="wagon"]');
    const serieSelect = form.querySelector('select[name="serie"]');
    let serieAutoSet = false; // tracks whether the current value was set automatically
    wagonInput.addEventListener("input", () => {
      const matched = serieFromWagon(wagonInput.value.trim());
      if(matched){
        serieSelect.value = matched;
        serieAutoSet = true;
      } else if(serieAutoSet){
        // prefix no longer matches (e.g. user is still typing/erasing) — reset to default
        serieSelect.value = SERIES[0];
        serieAutoSet = false;
      }
    });
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const fd = new FormData(form);
      const wagon = fd.get("wagon").trim();
      const wagonErr = document.getElementById("wagonError");
      if(!/^\d{7}$/.test(wagon)){
        wagonErr.classList.add("show");
        return;
      }
      wagonErr.classList.remove("show");
      const nextSeq = entries.reduce((m,e) => Math.max(m, Number(e.seq)||0), 0) + 1;
      const entry = {
        id: uid(),
        seq: nextSeq,
        record_version: 1,
        week: fd.get("week").trim(),
        site: fd.get("site"),
        wagon,
        serie: fd.get("serie"),
        status: fd.get("status"),
        motif: fd.get("motif"),
        isolation: fd.get("isolation"),
        observation: fd.get("observation").trim(),
        visitor: fd.get("visitor").trim(),
        created_at: new Date().toISOString()
      };
      if(!entry.site){ showToast("Merci de choisir un site"); return; }
      entries.push(entry);
      const ok = await saveEntries();
      if(ok){
        showToast("Saisie enregistrée");
        state.view = "situation";
      } else {
        showToast("Échec de l'enregistrement, réessayez");
        entries.pop();
      }
      render();
    });
  }

  if(state.view === "situation"){
    const search = document.getElementById("searchInput");
    search.addEventListener("input", () => {
      state.search = search.value.replace(/\D/g,"");
      render();
      document.getElementById("searchInput").focus();
      const val = document.getElementById("searchInput");
      val.selectionStart = val.selectionEnd = val.value.length;
    });
    document.getElementById("siteFilter").addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-site]");
      if(!btn) return;
      state.filterSite = btn.dataset.site;
      render();
    });
    document.querySelectorAll(".wagon-card").forEach(card => {
      card.addEventListener("click", () => openHistory(card.dataset.wagon));
    });
  }

  if(state.view === "export"){
    document.getElementById("exportSituation").addEventListener("click", () => {
      const rows = latestPerWagon(entries).sort((a,b)=>a.site.localeCompare(b.site)||a.wagon.localeCompare(b.wagon));
      const csv = toCSV(rows,
        ["Wagon","Site","Série","Semaine","Situation","Réforme en cours","Motif","Étiquette mod:","Observation","Agent","Saisi le"],
        r => [r.wagon,r.site,r.serie,r.week,r.status,isReformPending(r)?"Oui":"Non",r.motif,r.isolation,r.observation,r.visitor,fmtDateTime(r.created_at)]
      );
      downloadCSV(csv, "situation_actuelle_wagons_fret.csv");
    });

    document.getElementById("exportHistorique").addEventListener("click", () => {
      const rows = [...entries].sort((a,b)=>a.created_at.localeCompare(b.created_at));
      const csv = toCSV(rows,
        ["N° séquence","Identifiant","Wagon","Site","Série","Semaine","Situation","Motif","Étiquette mod:","Observation","Agent","Saisi le","Annulée le","Motif annulation"],
        r => [r.seq,r.id,r.wagon,r.site,r.serie,r.week,r.status,r.motif,r.isolation,r.observation,r.visitor,fmtDateTime(r.created_at),r.cancelled_at ? fmtDateTime(r.cancelled_at) : "",r.cancelled_reason]
      );
      downloadCSV(csv, "historique_complet_wagons_fret.csv");
    });

    document.getElementById("exportBackup").addEventListener("click", () => {
      const backup = {
        app: "Suivi Wagons FRET",
        format: "suivi-wagons-fret-backup",
        version: STORAGE_VERSION,
        exported_at: new Date().toISOString(),
        total_entries: entries.length,
        entries: entries
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href=url; a.download="sauvegarde_suivi_wagons_fret_"+new Date().toISOString().slice(0,10)+".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      showToast("Sauvegarde complète créée");
    });

    const importBtn = document.getElementById("importBackup");
    const fileInput = document.getElementById("backupFile");
    importBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files && fileInput.files[0];
      fileInput.value = "";
      if(!file) return;
      try{
        const parsed = JSON.parse(await file.text());
        const incoming = normalizeEntries(parsed.entries || parsed);
        if(!Array.isArray(incoming) || incoming.length === 0){
          showToast("Sauvegarde vide ou invalide");
          return;
        }
        const maxSeq = entries.reduce((m,e)=>Math.max(m,Number(e.seq)||0),0);
        const seen = new Set(entries.map(e=>e.id));
        let added = 0;
        for(const e of incoming){
          if(!e.id || seen.has(e.id)) continue;
          e.seq = Number(e.seq)||0;
          entries.push(e);
          seen.add(e.id);
          added++;
        }
        if(added === 0){
          showToast("Aucune nouvelle saisie à importer");
          return;
        }
        // Keep sequence numbers unique after a merge.
        const ordered = [...entries].sort((a,b)=>(Number(a.seq)||0)-(Number(b.seq)||0) || a.created_at.localeCompare(b.created_at));
        ordered.forEach((e,i)=>e.seq=i+1);
        const ok = await saveEntries();
        if(ok){
          showToast(added + " saisie(s) importée(s) — mémoire conservée");
          render();
        }else{
          showToast("Échec de la sauvegarde après import");
        }
      }catch(err){
        showToast("Fichier JSON invalide");
      }
    });
  }

  const retry = document.getElementById("retryLoad");
  if(retry){
    retry.addEventListener("click", async () => {
      await loadEntries();
      render();
    });
  }
}

document.getElementById("tabbar").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button[data-view]");
  if(!btn) return;
  state.view = btn.dataset.view;
  render();
});

  document.getElementById("main").innerHTML = `<div class="loading-row">Chargement des données…</div>`;
  await loadEntries();
  render();
})();
